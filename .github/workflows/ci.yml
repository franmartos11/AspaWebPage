# Corre en cada push a main y en cada pull request: lint, build, tipos y los tests de Playwright.
# La regresión visual no se compara (--ignore-snapshots): las capturas base son de macOS y en
# Linux el texto se dibuja distinto. Esa parte se sigue corriendo en local con `npm run test:e2e`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # después del build: tsconfig incluye los tipos de rutas que genera Next en .next/types
      - run: npx tsc --noEmit
      # usa el Chrome que trae el runner (channel: "chrome"); el servidor de los tests corre con CONTACT_DRY_RUN=1
      - run: npx playwright test --ignore-snapshots --project desktop-1440 --project mobile-375
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
